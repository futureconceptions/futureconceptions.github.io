# Reverse proxy: one origin for UI + API (no CORS, no credentials in the browser).
upstream api { server api:8000; }
upstream web { server frontend:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 130m;   # up to 8 product images x 15 MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
    }
    location = /docs { proxy_pass http://api; }
    location = /openapi.json { proxy_pass http://api; }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
