# One-command local stack:  cp .env.example .env && docker compose up --build
# UI: http://localhost:8080   API docs: http://localhost:8080/docs   MinIO console: http://localhost:9001
name: ugc-ad-factory

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://ugc:${POSTGRES_PASSWORD:-ugc}@postgres:5432/ugc
    REDIS_URL: redis://redis:6379/0
    TASK_DISPATCH: celery
    STORAGE_BACKEND: s3
    S3_ENDPOINT_URL: http://minio:9000
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    UGC_MOCK_DIR: /data/mock
    UGC_TMP: /data/tmp
  volumes:
    - workdata:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ugc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ugc}
      POSTGRES_DB: ugc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugc"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    # MinIO publishes images on its own registry (no longer on Docker Hub).
    # Any S3-compatible server works; see docs/OPERATIONS.md.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      retries: 30

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-Q", "pipeline,polling", "--loglevel=INFO",
              "--concurrency=${WORKER_CONCURRENCY:-4}"]
    depends_on:
      api: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    depends_on:
      api: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${HTTP_PORT:-8080}:80"]
    depends_on: [api, frontend]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  workdata:
