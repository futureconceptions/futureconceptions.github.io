# MERKANT Medien – Auslieferung der statischen Portale auf dem Raspberry Pi 5
#
#   cd portal-network/deploy
#   cp .env.example .env            # Werte eintragen (nicht committen!)
#   docker compose up -d
#
# Caddy liefert ../dist/<domain>/ aus (vorher: python3 ../build.py).
# cloudflared verbindet den Pi per Tunnel mit Cloudflare – keine Portfreigabe am Router nötig.
# Images sind multi-arch (arm64). Versionen bei Bedarf fest pinnen.

services:
  caddy:
    image: caddy:2-alpine
    container_name: merkant-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../dist:/srv/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    # Nur lokal erreichbar (Healthcheck/Vorschau im Heimnetz). Öffentlich nur über den Tunnel.
    ports:
      - "127.0.0.1:8080:8080"
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: merkant-cloudflared
    restart: unless-stopped
    depends_on: [caddy]
    networks: [web]
    # Variante A (empfohlen für den Start): Tunnel im Cloudflare-Dashboard anlegen,
    # Hostnamen dort auf http://caddy:80 routen und nur das Token in .env eintragen.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    # Variante B (lokal verwaltete Konfiguration, siehe cloudflared/config.yml.example):
    #   command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    #   volumes:
    #     - ./cloudflared:/etc/cloudflared:ro
    # und die environment-Zeile oben entfernen.

networks:
  web: {}

volumes:
  caddy_data: {}
  caddy_config: {}
